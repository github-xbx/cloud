syntax = "proto3";


option java_multiple_files = true;
option java_package = "grpc.ai.proto";
option java_outer_classname = "CityProto";


service cityRpc{
  rpc addressToCity(ReqMessage) returns (RespMessage);
}



message ReqMessage{
  string address = 1;
}


message RespMessage{
  string city = 1;
}



